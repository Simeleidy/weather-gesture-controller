<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Controlador de Gestos del Tiempo</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main>
    <h1>Controlador de Gestos del Tiempo</h1>

    <div id="stage">
      <video id="video" playsinline muted></video>
      <canvas id="canvas"></canvas>
      <div id="hint">Pulsa «Iniciar cámara» y permite el acceso</div>
      <div id="badge" hidden></div>
    </div>

    <div class="btns">
      <button id="start">Iniciar cámara</button>
      <button id="stop" disabled>Detener cámara</button>
    </div>
    <p id="status">Cámara apagada</p>
    <pre id="log">Manos: 0
Gesto: -
Clima: -</pre>

    <ul>
      <li>Puño: lluvia</li>
      <li>Mano abierta: sol</li>
      <li>Dedo índice: nublado</li>
      <li>Dos manos juntas: despejado</li>
      <li>Dos índices: modo estrella</li>
    </ul>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
